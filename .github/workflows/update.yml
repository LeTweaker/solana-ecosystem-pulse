name: Update reports
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python src/solana_pulse.py --once
      - run: python -m unittest discover -s tests -v
      - name: Commit refreshed outputs
        run: |
          git config user.name 'solana-pulse-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add output/
          git diff --cached --quiet || git commit -m 'chore: refresh ecosystem pulse'
          git push